<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Reset Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="phone-wrapper">
    <div id="main-content">        
        <div id="ios-topbar">
            <div id="top-button-container">
                <button id="top-button-left" class="ios-btn-active">Games</button>
                <button id="top-button-middle" class="ios-btn">Info</button>
                <button id="top-button-right" class="ios-btn">Submit</button>
            </div>
        </div>
        <div id="zine-links">
            <img class="zine-link-img" src="images/placeholder-banner.png">
        </div>
        <hr/>
        <div onclick="location.href='./watering-hole/index.html';" style="cursor: pointer;" class="game-entry">       
            <img class="game-list-image" src="./images/nRKLre.png">
            <p class="game-creator-text">2025</p>
            <p class="game-title-text">Volume #2</p>
            <p class="game-details-text">
                JohnLee Cooper, jwest, marcos.ac, Adam Pype, Caldera Peak Studios, Clifton B.
            </p>  
            <img class="arrow" src="images/nav-arrow-right.svg"/> 
        </div>
        <hr/>
        <div onclick="location.href='./watering-hole/index.html';" style="cursor: pointer;" class="game-entry">       
            <img class="game-list-image" src="./images/LsPUqq.png">
            <p class="game-creator-text">2024</p>
            <p class="game-title-text">Volume #1</p>
            <p class="game-details-text">
                JohnLee Cooper, jwest, Alexander Rhys, Helen Kwok, Chad Toprak, Barend Harris, Reluctant Pirate Games,
                Geoffrey Mugford, Corey Hardt, Sapazu, Paulby, Minotalen.
            </p>  
            <img class="arrow" src="images/nav-arrow-right.svg"/> 
        </div>
        <hr/>
    </div>
    <img id="phone-overlay" src="images/phone-overlay.png">
</div>

</body>
</html>
